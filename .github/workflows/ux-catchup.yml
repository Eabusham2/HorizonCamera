name: One-shot UX catch-up patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ux-catchup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Reconcile camera UX defaults and latency-sensitive behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # Defaults: mini overview ON, optional stats OFF, location metadata ON,
          # explicit native stabilization mode rather than Auto.
          replace_once('App/CameraSettings.swift',
          '''    var showOverview = false
              var scanQRCodes = true''',
          '''    var showOverview = true
              var showStats = false
              var scanQRCodes = true''')
          replace_once('App/CameraSettings.swift',
          '''    var stabilization: StabilizationChoice = .auto''',
          '''    var stabilization: StabilizationChoice = .standard''')
          replace_once('App/CameraSettings.swift',
          '''    var includeLocationMetadata = false''',
          '''    var includeLocationMetadata = true''')

          # Action no longer silently rewrites FPS/resolution/zoom lock/styles when toggled.
          # Keep the user's selected format, and derive a truthful stabilized output size.
          replace_once('App/CameraSettings.swift',
          '''    var outputSize: Size2 {
                  if let exact=resolution.exactSize { return exact }
                  return framing.size(longEdge:mode == .slowMotion ? min(1920,resolution.longEdge) : resolution.longEdge)
              }''',
          '''    var effectiveOutputResolution: Resolution {
                  if actionStabilization && !resolution.isRAWFrameSize && resolution.longEdge > Resolution.action2_8K.longEdge {
                      return .action2_8K
                  }
                  return resolution
              }
              var outputSize: Size2 {
                  let outputResolution = effectiveOutputResolution
                  if let exact=outputResolution.exactSize { return exact }
                  return framing.size(longEdge:mode == .slowMotion ? min(1920,outputResolution.longEdge) : outputResolution.longEdge)
              }''')
          replace_once('App/CameraSettings.swift',
          '''        if actionStabilization {
                  if mode != .video {
                      actionStabilization=false
                  } else {
                      zoomLock=false
                      fps=min(fps,60)
                      if resolution == .ultraHD || resolution.isRAWFrameSize { resolution = .action2_8K }
                      photographicStyle = .standard
                      filter = .original
                  }
              }''',
          '''        if actionStabilization && (mode != .video || fps > 60 || usesNativeMoviePipeline) {
                  // Do not silently rewrite the user's format. The UI keeps Action gray
                  // until the selected video combination can actually use the custom path.
                  actionStabilization = false
              }''')

          # Portrait is already a processed-photo path, so Horizon/Zoom Lock can remain available.
          replace_once('App/CameraSettings.swift',
          '''            depthData = true
                  portraitEffectsMatte = true
                  horizonLock = false
                  zoomLock = false
                  filter = .original''',
          '''            depthData = true
                  portraitEffectsMatte = true
                  filter = .original''')

          # Keep approximate 35mm-equivalent focal length alongside every exposed lens.
          replace_once('App/CameraSettings.swift',
          '''    let isVirtual: Bool
              let factor: Double
          }''',
          '''    let isVirtual: Bool
              let factor: Double
              let focalLengthMM: Int
          }''')

          # Native stabilization is a user-selected independent control. Auto is no longer
          # offered in the public choices, and Action doesn't secretly replace the selection.
          replace_once('App/AdvancedCameraSupport.swift',
          '''        if format.isVideoStabilizationModeSupported(.auto) { stabilizationModes.append(.auto) }
                  if #available(iOS 18.0, *), format.isVideoStabilizationModeSupported(.cinematicExtendedEnhanced) { stabilizationModes.append(.enhanced) }''',
          '''        if #available(iOS 18.0, *), format.isVideoStabilizationModeSupported(.cinematicExtendedEnhanced) { stabilizationModes.append(.enhanced) }''')
          replace_once('App/AdvancedCameraSupport.swift',
          '''    static func preferredStabilization(_ settings: CameraSettings, format: AVCaptureDevice.Format) -> AVCaptureVideoStabilizationMode {
                  if settings.actionStabilization {
                      return settings.actionNativeAssist ? preferredActionNativeStabilization(for:format) : .off
                  }
                  if settings.horizonLock || settings.zoomLock { return .off }
                  let requested = settings.stabilization.avMode
                  return format.isVideoStabilizationModeSupported(requested) ? requested : .off
              }''',
          '''    static func preferredStabilization(_ settings: CameraSettings, format: AVCaptureDevice.Format) -> AVCaptureVideoStabilizationMode {
                  if settings.horizonLock || settings.zoomLock { return .off }
                  let requested = settings.stabilization.avMode
                  return format.isVideoStabilizationModeSupported(requested) ? requested : .off
              }''')

          # Existing installs get the corrected shipped defaults once, without continually
          # overriding later user choices.
          replace_once('App/CameraModel.swift',
          '''        if let data=try? Data(contentsOf:settingsURL), let saved=Self.decodeSettingsMigrating(data) {
                  settings=Self.preparedForLaunch(saved)
              }
              engine?.onState = { [weak self] state in''',
          '''        if let data=try? Data(contentsOf:settingsURL), let saved=Self.decodeSettingsMigrating(data) {
                  settings=Self.preparedForLaunch(saved)
              }
              let uxDefaultsKey = "HorizonCamera.UXDefaults.v2"
              if !UserDefaults.standard.bool(forKey:uxDefaultsKey) {
                  settings.showOverview = true
                  settings.showStats = false
                  settings.includeLocationMetadata = true
                  if settings.stabilization == .auto { settings.stabilization = .standard }
                  UserDefaults.standard.set(true,forKey:uxDefaultsKey)
              }
              engine?.onState = { [weak self] state in''')

          # The user explicitly wants camera-library permission in the startup permission pass.
          replace_once('App/CameraModel.swift',
          '''            if PHPhotoLibrary.authorizationStatus(for:.addOnly) == .notDetermined { _ = await PHPhotoLibrary.requestAuthorization(for:.addOnly) }''',
          '''            if PHPhotoLibrary.authorizationStatus(for:.readWrite) == .notDetermined { _ = await PHPhotoLibrary.requestAuthorization(for:.readWrite) }''')

          # Avoid re-entering expensive session/photo-output configuration for post-only
          # Smart/Action toggles. Only settings that really touch AVFoundation hardware do it.
          replace_once('App/CameraModel.swift',
          '''    func change(_ edit: (inout CameraSettings) -> Void) {
                  guard canConfigure else { return }
                  let old = settings
                  var next = old; edit(&next)
                  next.normalize(changedFrom: old)
                  if next.includeLocationMetadata && !old.includeLocationMetadata { CaptureLocation.shared.request() }
                  if !next.includeLocationMetadata && old.includeLocationMetadata { CaptureLocation.shared.stop() }
                  settings = next
                  settingsTask?.cancel()
                  if !next.requiresCaptureReconfiguration(comparedTo: old) {
                      engine?.update(next)
                      if let engine { NativeMovieController.applyLiveSettings(next,engine:engine) }
                      settingsTask = Task { [weak self] in
                          try? await Task.sleep(for:.milliseconds(120))
                          if !Task.isCancelled { self?.persist() }
                      }
                  } else {
                      settingsTask = Task { [weak self] in
                          try? await Task.sleep(for:.milliseconds(70))
                          guard !Task.isCancelled, let self else { return }
                          engine?.update(settings)
                          if let engine { NativeMovieController.applyLiveSettings(settings,engine:engine) }
                          persist()
                      }
                  }
              }''',
          '''    private func needsAdvancedLiveApply(_ old: CameraSettings, _ next: CameraSettings) -> Bool {
                  old.centerStage != next.centerStage || old.smartFraming != next.smartFraming ||
                  old.lensCleaningHints != next.lensCleaningHints || old.lockCameraSwitching != next.lockCameraSwitching ||
                  old.autoFPS != next.autoFPS || old.smoothAutofocus != next.smoothAutofocus ||
                  old.faceDrivenAutofocus != next.faceDrivenAutofocus || old.focusRange != next.focusRange ||
                  old.responsiveCapture != next.responsiveCapture || old.zeroShutterLag != next.zeroShutterLag ||
                  old.fastCapturePrioritization != next.fastCapturePrioritization ||
                  old.autoDeferredPhotoDelivery != next.autoDeferredPhotoDelivery || old.depthData != next.depthData ||
                  old.portraitEffectsMatte != next.portraitEffectsMatte || old.semanticMattes != next.semanticMattes ||
                  old.constantColor != next.constantColor || old.sensorOrientationCompensation != next.sensorOrientationCompensation ||
                  old.contentAwareDistortionCorrection != next.contentAwareDistortionCorrection ||
                  old.colorProfile != next.colorProfile || old.audioMode != next.audioMode ||
                  old.windNoiseRemoval != next.windNoiseRemoval
              }

              func change(_ edit: (inout CameraSettings) -> Void) {
                  guard canConfigure else { return }
                  let old = settings
                  var next = old; edit(&next)
                  next.normalize(changedFrom: old)
                  if next.includeLocationMetadata && !old.includeLocationMetadata { CaptureLocation.shared.request() }
                  if !next.includeLocationMetadata && old.includeLocationMetadata { CaptureLocation.shared.stop() }
                  settings = next
                  settingsTask?.cancel()
                  if !next.requiresCaptureReconfiguration(comparedTo: old) {
                      engine?.update(next)
                      if needsAdvancedLiveApply(old,next), let engine { NativeMovieController.applyLiveSettings(next,engine:engine) }
                      settingsTask = Task { [weak self] in
                          try? await Task.sleep(for:.milliseconds(120))
                          if !Task.isCancelled { self?.persist() }
                      }
                  } else {
                      settingsTask = Task { [weak self] in
                          try? await Task.sleep(for:.milliseconds(70))
                          guard !Task.isCancelled, let self else { return }
                          engine?.update(settings)
                          if let engine { NativeMovieController.applyLiveSettings(settings,engine:engine) }
                          persist()
                      }
                  }
              }''')

          # Action-incompatible native/HDR codecs remain visible to the UI but cannot be selected
          # while Action is active; the UI pass supplies the human-readable reason.
          replace_once('App/CameraModel.swift',
          '''        case .proResLT, .proRes422, .proResHQ: return settings.mode == .video && capabilities.proRes''',
          '''        case .proResLT, .proRes422, .proResHQ: return settings.mode == .video && !settings.actionStabilization && capabilities.proRes''')
          replace_once('App/CameraModel.swift',
          '''        guard settings.mode == .video, !settings.codec.isProResRAW else { return profile == .sdr && !settings.codec.isProResRAW }''',
          '''        guard settings.mode == .video, !settings.codec.isProResRAW, !settings.actionStabilization else { return profile == .sdr && !settings.codec.isProResRAW }''')

          # Expose focal length to the view without asking the UI to infer the physical lens.
          replace_once('App/CameraModel.swift',
          '''    var currentLensFactor: Double {
                  capabilities.lenses.first(where:{$0.id == capabilities.selectedLens})?.factor ?? 1
              }
              var displayZoom: Double { currentLensFactor * settings.zoom }''',
          '''    var currentLensFactor: Double {
                  capabilities.lenses.first(where:{$0.id == capabilities.selectedLens})?.factor ?? 1
              }
              var currentFocalLengthMM: Int {
                  capabilities.lenses.first(where:{$0.id == capabilities.selectedLens})?.focalLengthMM ?? 24
              }
              var displayFocalLengthMM: Int { max(1,Int((Double(currentFocalLengthMM) * settings.zoom).rounded())) }
              var isFrontCamera: Bool { capabilities.lenses.first(where:{$0.id == capabilities.selectedLens})?.isFront ?? false }
              var displayZoom: Double { currentLensFactor * settings.zoom }''')

          # Toggling Action no longer rebuilds Camera Control; those controls don't depend on Action.
          replace_once('App/CaptureEngine.swift',
          '''                        if old.actionStabilization != settings.actionStabilization || old.manualFocus != settings.manualFocus {
                                  configureCameraControls(settings,device:device)''',
          '''                        if old.manualFocus != settings.manualFocus {
                                  configureCameraControls(settings,device:device)''')

          replace_once('App/CaptureEngine.swift',
          '''            let front=camera.position == .front
                      let factor=front ? 1.0 : tan(Double(wideFOV) * .pi / 360) / tan(Double(camera.activeFormat.videoFieldOfView) * .pi / 360)
                      let label=front ? "Front" : (abs(factor-factor.rounded()) < 0.12 ? String(format:"%.0f×",factor) : String(format:"%.1f×",factor))
                      return LensOption(id:camera.uniqueID,label:label,name:camera.localizedName,isFront:front,isVirtual:false,factor:max(0.5,factor))''',
          '''            let front=camera.position == .front
                      let cameraFOV=Double(camera.activeFormat.videoFieldOfView)
                      let factor=front ? 1.0 : tan(Double(wideFOV) * .pi / 360) / tan(cameraFOV * .pi / 360)
                      let label=front ? "Front" : (abs(factor-factor.rounded()) < 0.12 ? String(format:"%.0f×",factor) : String(format:"%.1f×",factor))
                      let focalLengthMM=max(1,Int((18.0 / tan(max(1.0,min(179.0,cameraFOV)) * .pi / 360)).rounded()))
                      return LensOption(id:camera.uniqueID,label:label,name:camera.localizedName,isFront:front,isVirtual:false,factor:max(0.5,factor),focalLengthMM:focalLengthMM)''')

          # Smart/Action custom correction is output-only and dormant when not recording,
          # eliminating needless preview-path work and the visible toggle delay.
          replace_once('App/ImagePipeline.swift',
          '''    private var frozenAngle: Double?
              private var planHistory: [(Double, CropPlan)] = []''',
          '''    private var frozenAngle: Double?
              private var recording = false
              private var planHistory: [(Double, CropPlan)] = []''')
          replace_once('App/ImagePipeline.swift',
          '''    func beginRecording() { frozenAngle = lastPlan?.angle }
              func endRecording() { frozenAngle = nil }''',
          '''    func beginRecording() { recording = true; frozenAngle = lastPlan?.angle }
              func endRecording() { recording = false; frozenAngle = nil }''')
          replace_once('App/ImagePipeline.swift',
          '''        let smartSteady = settings.smartArtifactGuard && settings.mode.isMovie''',
          '''        let smartSteady = recording && settings.smartArtifactGuard && settings.mode.isMovie''')
          replace_once('App/ImagePipeline.swift',
          '''        if (settings.actionStabilization || smartSteady), let reading {''',
          '''        if recording && (settings.actionStabilization || smartSteady), let reading {''')
          replace_once('App/ImagePipeline.swift',
          '''        let captureCenter = Point2(previewPlan.center.x + actionOffset.x*size.width,
                                         previewPlan.center.y + actionOffset.y*size.height)
                  let capturePlan = try CropGeometry.plan(source:size, output:settings.outputSize, angle:captureAngle,
                      zoom:renderedZoom, fullTurn:settings.horizonLock, reserve:settings.captureReserve,
                      requestedCenter:captureCenter)

                  lastPlan = previewPlan''',
          '''        let capturePlan: CropPlan
                  if recording {
                      let captureCenter = Point2(previewPlan.center.x + actionOffset.x*size.width,
                                                 previewPlan.center.y + actionOffset.y*size.height)
                      capturePlan = try CropGeometry.plan(source:size, output:settings.outputSize, angle:captureAngle,
                          zoom:renderedZoom, fullTurn:settings.horizonLock, reserve:settings.captureReserve,
                          requestedCenter:captureCenter)
                  } else {
                      capturePlan = previewPlan
                  }

                  lastPlan = previewPlan''')
          replace_once('App/ImagePipeline.swift',
          '''        let previewImage = renderer.applyLook(renderer.transform(source,plan:previewPlan),settings:settings)
                  let recordingImage = renderer.applyLook(renderer.transform(source,plan:capturePlan),settings:settings)''',
          '''        let previewImage = renderer.applyLook(renderer.transform(source,plan:previewPlan),settings:settings)
                  let recordingImage = recording ? renderer.applyLook(renderer.transform(source,plan:capturePlan),settings:settings) : previewImage''')

          # Startup Photos read/write permission needs the read usage key; location metadata is now on by default.
          replace_once('App/Info.plist',
          '''\t<key>NSLocationWhenInUseUsageDescription</key>
          \t<string>Optionally add your current location to photo and video metadata when you enable Location metadata.</string>''',
          '''\t<key>NSLocationWhenInUseUsageDescription</key>
          \t<string>Add your current location to photo and video metadata. You can turn Location metadata off in camera settings.</string>''')
          replace_once('App/Info.plist',
          '''\t<key>NSPhotoLibraryAddUsageDescription</key>
          \t<string>Save captured photos and videos to Apple Photos. No existing photos are read.</string>''',
          '''\t<key>NSPhotoLibraryAddUsageDescription</key>
          \t<string>Save captured photos and videos to Apple Photos.</string>
          \t<key>NSPhotoLibraryUsageDescription</key>
          \t<string>Show and manage your camera library alongside captures made in Horizon.</string>''')

          # Tests must protect the requested behavior, not the old regressions.
          replace_once('Tests/HorizonCameraTests/AdvancedCameraTests.swift',
          '''        XCTAssertTrue(s.depthData); XCTAssertTrue(s.portraitEffectsMatte)
                  XCTAssertFalse(s.horizonLock); XCTAssertFalse(s.zoomLock); XCTAssertFalse(s.raw); XCTAssertFalse(s.livePhoto)''',
          '''        XCTAssertTrue(s.depthData); XCTAssertTrue(s.portraitEffectsMatte)
                  XCTAssertTrue(s.horizonLock); XCTAssertTrue(s.zoomLock); XCTAssertFalse(s.raw); XCTAssertFalse(s.livePhoto)''')
          replace_once('Tests/HorizonCameraTests/AdvancedCameraTests.swift',
          '''        var action=CameraSettings(); let a0=action
                  action.mode = .video; action.actionStabilization = true; action.actionNativeAssist = true; action.actionStrength = 0.9
                  action.zoomLock=true; action.colorProfile = .hdrHLG; action.codec = .proRes422; action.audioMode = .stereo
                  action.normalize(changedFrom:a0)
                  XCTAssertTrue(action.actionStabilization); XCTAssertTrue(action.actionNativeAssist); XCTAssertFalse(action.zoomLock)
                  XCTAssertEqual(action.codec,.proRes422); XCTAssertEqual(action.colorProfile,.hdrHLG); XCTAssertEqual(action.audioMode,.stereo)
                  XCTAssertFalse(action.horizonLock); XCTAssertEqual(action.actionStrength,0.82,accuracy:0.001); XCTAssertLessThan(action.captureReserve,0.70)''',
          '''        var action=CameraSettings(); let a0=action
                  action.mode = .video; action.actionStabilization = true; action.actionNativeAssist = true; action.actionStrength = 0.9
                  action.zoomLock=true
                  action.normalize(changedFrom:a0)
                  XCTAssertTrue(action.actionStabilization); XCTAssertTrue(action.actionNativeAssist); XCTAssertTrue(action.zoomLock)
                  XCTAssertEqual(action.actionStrength,0.82,accuracy:0.001); XCTAssertLessThan(action.captureReserve,0.70)

                  var incompatible=CameraSettings(); let i0=incompatible
                  incompatible.actionStabilization=true; incompatible.colorProfile = .hdrHLG; incompatible.codec = .proRes422; incompatible.audioMode = .stereo
                  incompatible.normalize(changedFrom:i0)
                  XCTAssertFalse(incompatible.actionStabilization)
                  XCTAssertEqual(incompatible.codec,.proRes422); XCTAssertEqual(incompatible.colorProfile,.hdrHLG); XCTAssertEqual(incompatible.audioMode,.stereo)''')
          replace_once('Tests/HorizonCameraTests/AdvancedCameraTests.swift',
          '''    func testNewUXDefaultsAreSafeAndUncluttered() {
                  let s=CameraSettings()
                  XCTAssertEqual(s.zoom,1,accuracy:0.0001)
                  XCTAssertFalse(s.grid); XCTAssertFalse(s.showOverview)
                  XCTAssertTrue(s.showDetectedText); XCTAssertTrue(s.smartArtifactGuard)
                  XCTAssertFalse(s.customMetadataEnabled); XCTAssertFalse(s.includeLocationMetadata)
              }''',
          '''    func testNewUXDefaultsAreSafeAndUncluttered() {
                  let s=CameraSettings()
                  XCTAssertEqual(s.zoom,1,accuracy:0.0001)
                  XCTAssertFalse(s.grid); XCTAssertTrue(s.showOverview); XCTAssertFalse(s.showStats)
                  XCTAssertTrue(s.showDetectedText); XCTAssertTrue(s.smartArtifactGuard)
                  XCTAssertFalse(s.customMetadataEnabled); XCTAssertTrue(s.includeLocationMetadata)
                  XCTAssertEqual(s.stabilization,.standard)
              }''')
          replace_once('Tests/HorizonCameraTests/AdvancedCameraTests.swift',
          '''    func testActionMatchesPublicAppleEnvelopeAndDoesNotForceSDR() {
                  var s=CameraSettings(); let old=s; s.mode = .video; s.resolution = .ultraHD; s.fps=120; s.actionStabilization=true; s.codec = .efficient; s.colorProfile = .hdrHLG
                  s.normalize(changedFrom:old)
                  XCTAssertEqual(s.fps,60,accuracy:0.001); XCTAssertEqual(s.resolution,.action2_8K)
                  XCTAssertEqual(s.colorProfile,.hdrHLG); XCTAssertTrue(s.actionStabilization); XCTAssertFalse(s.zoomLock)
              }''',
          '''    func testActionDoesNotSilentlyRewriteIncompatibleSelections() {
                  var s=CameraSettings(); let old=s; s.mode = .video; s.resolution = .ultraHD; s.fps=120; s.actionStabilization=true; s.codec = .efficient; s.colorProfile = .hdrHLG
                  s.normalize(changedFrom:old)
                  XCTAssertEqual(s.fps,120,accuracy:0.001); XCTAssertEqual(s.resolution,.ultraHD)
                  XCTAssertEqual(s.colorProfile,.hdrHLG); XCTAssertFalse(s.actionStabilization)

                  var compatible=CameraSettings(); let compatibleOld=compatible
                  compatible.horizonLock=false; compatible.resolution = .ultraHD; compatible.actionStabilization=true
                  compatible.normalize(changedFrom:compatibleOld)
                  XCTAssertTrue(compatible.actionStabilization); XCTAssertEqual(compatible.resolution,.ultraHD)
                  XCTAssertEqual(compatible.effectiveOutputResolution,.action2_8K)
              }''')

          # Documentation text in Settings must match the new defaults.
          replace_once('App/CameraSettingsView.swift',
          '''            Text("Live Text detects quietly; the text panel only opens after you tap the Live Text button. Mini overview is off by default and shows the full active lens with the actual output crop in yellow. Grid is off by default. Persistent settings are remembered; live zoom resets to 1× each launch.")''',
          '''            Toggle("Statistics overlay",isOn:model.binding(\\.showStats))
                      Text("Live Text detection is shown automatically in the viewfinder. Mini overview is on by default and shows the full active lens with the actual output crop in yellow. Statistics and Grid are off by default. Persistent settings are remembered; live zoom resets to 1× each launch.")''')
          replace_once('App/CameraSettingsView.swift',
          '''            Text("Custom metadata is off by default. With it off, HorizonCamera preserves camera/AVFoundation metadata instead of injecting title/author/software fields. Location is also off until explicitly enabled.")''',
          '''            Text("Custom title/author metadata is off by default. Location metadata is on by default and can be disabled here; HorizonCamera otherwise preserves camera/AVFoundation metadata.")''')

          # Sanity checks before writing anything back.
          text = Path('App/CameraSettings.swift').read_text()
          assert 'var showOverview = true' in text and 'var showStats = false' in text and 'var includeLocationMetadata = true' in text
          assert 'zoomLock=false' not in text[text.index('if actionStabilization'):text.index('if mode == .panorama')]
          assert 'NSPhotoLibraryUsageDescription' in Path('App/Info.plist').read_text()
          PY
          git diff --check
          git status --short
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HorizonCamera CI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add App Tests
          git diff --cached --quiet && exit 0
          git commit -m 'Fix camera defaults and stabilization latency paths'
          git push origin HEAD:main

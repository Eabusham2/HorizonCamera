name: One-shot UX catch-up patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-catchup.yml'
      - '.github/ux_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Reconcile camera defaults and latency-sensitive paths
        run: |
          set -euo pipefail
          python3 .github/ux_patch.py
          git diff --check
          git status --short
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'HorizonCamera CI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add App Tests
          git diff --cached --quiet && exit 0
          git commit -m 'Fix camera defaults and stabilization latency paths'
          git push origin HEAD:main

name: Fix camera format compatibility behavior
on:
  push:
    branches: [main]
    paths:
      - '.github/fix_format_compat.py'
      - '.github/workflows/fix-format-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - run: |
          set -euo pipefail
          python3 .github/fix_format_compat.py
          git diff --check
      - run: |
          set -euo pipefail
          git config user.name 'HorizonCamera CI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add App Tests/HorizonCameraTests/AdvancedCameraTests.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Gray incompatible format pairs without silent changes'
          git push origin HEAD:main
